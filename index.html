<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">

        <!--header-->
        <header class="header">
            <div class="logo">
                weatherNow
            </div>
            <button id="themeBtn" class="theme-btn">
                🌙
            </button>
        </header>
        <!--search-->
        <section class="search-section">
            <div class="search-box">

                <input
                   type="text"
                   id="cityInput"
                   placeholder="Search city..."
                   autocomplete="off"
                   >
                   <button id="searchBtn">
                        search
                   </button>
            </div>
            <button id="locationBtn" class="location-btn">
                use my location
                </button>

        </section>
        <!--location-->
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Fetching weather</p>
    </div>
    <!--Error-->
    <div id="error" class="error hidden">
        <p id="errorMessage">
            something went wrong.
        </p>
    </div>
        <!--wheather content-->
        <main id="weatherContent" class="hidden">
            <!--current weather-->
            <section class="current-weather">
                <div class="location-info">
                    <h1 id="cityName">
                        jaipur
                    </h1>
                    <p id="date">
                        monday,september 15
                    </p>
                </div>
                <div class="main-weather">
                    <div class="weather-icon" id="weatherIcon">
                        ☀️
                    </div>
                    <div class="temperature">
                        <span id="temperature">
                            32
                        </span>
                        <span class="degree">°C</span>
                        
                    </div>
                    <div class="weather-description" id="description">
                        clear sky

                    </div>

                </div>
                <!--weather stats-->
                <div class = "weather-stats">
                    <div class="stat-card">
                        <div class="stat-icon">
                           💧 
                        </div>
                        <div>
                            <p>Humidity</p>
                            <h3 id="humidity">65%</h3>

                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            💨
                        </div>
                        <div>
                            <p>Wind</p>
                            <h3 id="wind">12 km/h</h3>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            👁️
                        </div>
                        <div>
                            <p>Visibility</p>
                            <h3 id="visibility">10 km</h3>
                            
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            🌡️
                        </div>
                        <div>
                        <p>Feels like</p>
                        <h3 id="feelsLike">34°C</h3>
                    </div>
                 </div>
                    
                </div>
            </section>
            <!--Forecast-->
            <section class="forecast-section">
                <div class="section-title">
                    <h2>5-DAy Forecast</h2>
                </div>
                <div id="forecast" class="forecast">
                    <!--Forecast cards genetered by js-->
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
